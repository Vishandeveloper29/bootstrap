<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practical4</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-4">

        <h2 class="text-center">Offset Column</h2>
        <div class="row mb-4">
            <div class="col-md-4 offset-md-4 border p-3 text-center">
                Center Column with Offset
            </div>
        </div>

        <h2 class="text-center">Reordering Column</h2>
        <div class="row mb-4">
            <div class="col-md-4 order-md-3 border p-3 text-center">
                First in HTML, Last on Screen
            </div>
            <div class="col-md-4 order-md-2 border p-3 text-center">
                Second in HTML, Middle on Screen
            </div>
            <div class="col-md-4 order-md-1 border p-3 text-center">
                Third in HTML, First on Screen
            </div>
        </div>

        <h2 class="text-center">Nesting Column</h2>
        <div class="row mb-4">
            <div class="col-md-6 border p-3">
                Outer Column 1
                <div class="row mt-2">
                    <div class="col-6 border p-2">Nested 1</div>
                    <div class="col-6 border p-2">Nested 2</div>
                </div>
            </div>
            <div class="col-md-6 border p-3">
                Outer Column 2
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
