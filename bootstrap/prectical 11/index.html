<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Form - Bootstrap Input Groups</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>
  <div class="container">

    <div class="page-header text-center">
      <h2>Job Application Form</h2>
      <p>Fill in your details below to apply for a position</p>
    </div>

    <form>
      <div class="row">

        <div class="col-md-6">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-user"></span></span>
              <input type="text" class="form-control" placeholder="Enter your full name">
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-envelope"></span></span>
              <input type="email" class="form-control" placeholder="you@example.com">
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>Mobile Number</label>
            <div class="input-group">
              <span class="input-group-addon">+91</span>
              <input type="text" class="form-control" placeholder="98765 43210">
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>Date of Birth</label>
            <div class="input-group">
              <input type="date" class="form-control">
              <span class="input-group-addon"><span class="glyphicon glyphicon-calendar"></span></span>
            </div>
          </div>
        </div>

        <div class="col-md-12">
          <div class="form-group">
            <label>Address</label>
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-home"></span></span>
              <input type="text" class="form-control" placeholder="House no, Street, Area">
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>City</label>
            <div class="input-group">
              <span class="input-group-addon">City</span>
              <input type="text" class="form-control" placeholder="Enter city">
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>State</label>
            <div class="input-group">
              <span class="input-group-addon">State</span>
              <select class="form-control">
                <option>Gujarat</option>
                <option>Maharashtra</option>
                <option>Rajasthan</option>
                <option>Other</option>
              </select>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>Qualification</label>
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-education"></span></span>
              <select class="form-control">
                <option>Diploma</option>
                <option>B.E. / B.Tech</option>
                <option>M.E. / M.Tech</option>
                <option>Other</option>
              </select>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>Years of Experience</label>
            <div class="input-group">
              <input type="number" class="form-control" placeholder="0" min="0">
              <span class="input-group-addon">Years</span>
            </div>
          </div>
        </div>

        <div class="col-md-12">
          <div class="form-group">
            <label>Skills</label>
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-wrench"></span></span>
              <input type="text" class="form-control" placeholder="HTML, CSS, Bootstrap, JavaScript">
              <span class="input-group-btn">
                <button class="btn btn-default" type="button">Add</button>
              </span>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>Expected Salary</label>
            <div class="input-group">
              <span class="input-group-addon">&#8377;</span>
              <input type="text" class="form-control" placeholder="e.g. 25000">
              <span class="input-group-addon">/ month</span>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="form-group">
            <label>Resume Upload</label>
            <div class="input-group">
              <span class="input-group-addon"><span class="glyphicon glyphicon-file"></span></span>
              <input type="text" class="form-control" placeholder="Choose file..." readonly>
              <span class="input-group-btn">
                <span class="btn btn-default btn-file">
                  Browse&hellip; <input type="file"
                    style="position:absolute; top:0; left:0; opacity:0; width:100%; height:100%;">
                </span>
              </span>
            </div>
          </div>
        </div>

        <div class="col-md-12">
          <div class="form-group">
            <label>Notify Me By</label><br>
            <div class="input-group">
              <span class="input-group-addon">
                <input type="checkbox" checked> Email
              </span>
              <span class="input-group-addon">
                <input type="checkbox"> SMS
              </span>
              <span class="input-group-addon">
                <input type="radio" name="pref"> Call
              </span>
              <input type="text" class="form-control" placeholder="Preferred contact time">
            </div>
          </div>
        </div>

      </div>

      <div class="form-group text-center">
        <button type="submit" class="btn btn-primary">Submit Application</button>
        <button type="reset" class="btn btn-warning">Reset</button>
        <button type="button" class="btn btn-default">Cancel</button>
      </div>

    </form>

  </div>
</body>

</html>
