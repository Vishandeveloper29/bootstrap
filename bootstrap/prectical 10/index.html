<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Courses</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-4 mb-4 text-center">
        <h2 class="mb-4">Semester Wise Courses</h2>
        <div class="btn-toolbar justify-content-center mb-4" role="toolbar">
            <div class="btn-group me-2" role="group">
                <button type="button" class="btn btn-primary" onclick="showCourses('sem1')">Sem 1</button>
                <button type="button" class="btn btn-primary" onclick="showCourses('sem3')">Sem 3</button>
                <button type="button" class="btn btn-primary" onclick="showCourses('sem5')">Sem 5</button>
            </div>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-success" onclick="showCourses('sem2')">Sem 2</button>
                <button type="button" class="btn btn-success" onclick="showCourses('sem4')">Sem 4</button>
                <button type="button" class="btn btn-success" onclick="showCourses('sem6')">Sem 6</button>
            </div>
        </div>
        <div id="sem1" class="sem-courses d-none">
            <h5>Semester 1 Courses</h5>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-dark">Mathematics 1</button>
                <button class="btn btn-outline-dark">Physics</button>
                <button class="btn btn-outline-dark">C Programming</button>
                <button class="btn btn-outline-dark">English</button>
            </div>
        </div>
        <div id="sem2" class="sem-courses d-none">
            <h5>Semester 2 Courses</h5>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-dark">Mathematics 2</button>
                <button class="btn btn-outline-dark">Chemistry</button>
                <button class="btn btn-outline-dark">Data Structures</button>
                <button class="btn btn-outline-dark">Digital Electronics</button>
            </div>
        </div>
        <div id="sem3" class="sem-courses d-none">
            <h5>Semester 3 Courses</h5>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-dark">DBMS</button>
                <button class="btn btn-outline-dark">OOP with Java</button>
                <button class="btn btn-outline-dark">Computer Networks</button>
                <button class="btn btn-outline-dark">OS</button>
            </div>
        </div>
        <div id="sem4" class="sem-courses d-none">
            <h5>Semester 4 Courses</h5>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-dark">Web Technology</button>
                <button class="btn btn-outline-dark">Software Engineering</button>
                <button class="btn btn-outline-dark">Java Programming</button>
                <button class="btn btn-outline-dark">Microprocessor</button>
            </div>
        </div>
        <div id="sem5" class="sem-courses d-none">
            <h5>Semester 5 Courses</h5>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-dark">Python Programming</button>
                <button class="btn btn-outline-dark">Cloud Computing</button>
                <button class="btn btn-outline-dark">Mobile App Development</button>
                <button class="btn btn-outline-dark">Cyber Security</button>
            </div>
        </div>
        <div id="sem6" class="sem-courses d-none">
            <h5>Semester 6 Courses</h5>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-dark">Machine Learning</button>
                <button class="btn btn-outline-dark">Artificial Intelligence</button>
                <button class="btn btn-outline-dark">Project Work</button>
                <button class="btn btn-outline-dark">Big Data</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showCourses(id) {
            document.querySelectorAll('.sem-courses').forEach(function (el) { el.classList.add('d-none'); });
            document.getElementById(id).classList.remove('d-none');
        }
    </script>
</body>

</html>
